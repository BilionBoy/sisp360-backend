---
openapi: 3.0.1
info:
  title: SISP360 API - Sistema de Informação de Segurança Pública de Porto Velho
  version: 1.0.0
  description: |
    API RESTful para o sistema SISP360 de análise e gestão de dados de criminalidade em Porto Velho/RO.

    ## Recursos Principais

    - **Ocorrências**: Registro e consulta de ocorrências criminais
    - **Bairros e Zonas**: Informações geográficas e administrativas
    - **Tipos de Crime**: Categorização baseada em SENASP
    - **Estatísticas**: Dados agregados por bairro e período
    - **Indicadores Socioeconômicos**: Correlação com criminalidade
    - **Complexos Habitacionais**: Dados de conjuntos residenciais
    - **Pesquisas**: Dados de pesquisas sociais
    - **Usuários e Auditoria**: Gestão de usuários e logs de auditoria

    ## Paginação

    Todos os endpoints de listagem (GET /api/v1/{resource}) suportam paginação via query parameters:
    - `page` (integer): Número da página (default: 1)
    - `items` (integer): Itens por página (default: 25)

    A resposta inclui metadados de paginação:
    - `current_page`: Página atual
    - `per_page`: Itens por página
    - `total_pages`: Total de páginas
    - `total_count`: Total de registros

    ## Filtros

    Endpoints de listagem suportam filtros via query parameters específicos de cada recurso.
paths:
  "/api/v1/auditorias":
    get:
      summary: Lista todos os registros de auditoria
      tags:
      - Auditoria
      description: Lista logs de auditoria do sistema para rastreamento de ações dos
        usuários.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: items
        in: query
        required: false
        schema:
          type: integer
      - name: id_usuario
        in: query
        required: false
        description: Filtrar por ID do usuário
        schema:
          type: integer
      - name: acao
        in: query
        required: false
        description: Filtrar por tipo de ação
        schema:
          type: string
      - name: tabela_afetada
        in: query
        required: false
        description: Filtrar por tabela afetada
        schema:
          type: string
      responses:
        '200':
          description: Lista de auditorias
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_count:
                    type: integer
                  auditorias:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Auditoria"
    post:
      summary: Cria um novo registro de auditoria
      tags:
      - Auditoria
      description: Registra uma ação de auditoria no sistema.
      parameters: []
      responses:
        '201':
          description: Auditoria criada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Auditoria"
        '422':
          description: Erro de validação
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auditoria:
                  type: object
                  properties:
                    id_usuario:
                      type: integer
                      example: 1
                      nullable: true
                    acao:
                      type: string
                      example: CREATE
                    tabela_afetada:
                      type: string
                      example: ocorrencias
                      nullable: true
                    id_registro_afetado:
                      type: integer
                      example: 123
                      nullable: true
                    dados_anteriores:
                      type: object
                      example:
                        status: Registrada
                      nullable: true
                    dados_novos:
                      type: object
                      example:
                        status: Em Investigação
                      nullable: true
                    ip_origem:
                      type: string
                      format: ipv4
                      example: 192.168.1.1
                      nullable: true
                    user_agent:
                      type: string
                      example: Mozilla/5.0...
                      nullable: true
                  required:
                  - acao
              required:
              - auditoria
