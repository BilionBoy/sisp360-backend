              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_count:
                    type: integer
                  usuarios:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Usuario"
