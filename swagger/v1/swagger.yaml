        in: query
        type: string
        required: false
        schema:
          type: string
          enum:
          - Admin
          - Analista
          - Operador
          - Consulta
      - name: ativo
        in: query
        required: false
        schema:
          type: boolean
      - name: email
        in: query
        required: false
        schema:
          type: string
