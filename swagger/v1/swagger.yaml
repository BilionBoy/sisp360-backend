  "/api/v1/ocorrencias":
    get:
      summary: Lista todas as ocorrências criminais
      tags:
      - Ocorrências
      parameters:
      - name: page
        in: query
        required: false
        description: 'Número da página (default: 1)'
        schema:
          type: integer
      - name: items
        in: query
        required: false
        description: 'Itens por página (default: 25)'
        schema:
          type: integer
      - name: numero_bo
        in: query
        required: false
        description: Filtrar por número do Boletim de Ocorrência
        schema:
          type: string
      - name: id_tipo_crime
        in: query
        required: false
        description: Filtrar por ID do tipo de crime
        schema:
          type: integer
      - name: id_bairro
        in: query
        required: false
        description: Filtrar por ID do bairro
        schema:
          type: integer
      - name: data_ocorrencia
        in: query
        format: date
        required: false
        description: Filtrar por data da ocorrência (YYYY-MM-DD)
        schema:
          type: string
      - name: periodo_dia
        in: query
        type: string
        required: false
        description: Filtrar por período do dia
        schema:
          type: string
          enum:
          - Madrugada
          - Manhã
          - Tarde
          - Noite
      - name: status_ocorrencia
        in: query
        type: string
        required: false
        description: Filtrar por status da ocorrência
        schema:
          type: string
          enum:
          - Registrada
          - Em Investigação
          - Resolvida
          - Arquivada
      responses:
        '200':
          description: Lista de ocorrências com paginação
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 25
                  total_pages:
                    type: integer
                    example: 10
                  total_count:
                    type: integer
                    example: 250
                  ocorrencias:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Ocorrencia"
                required:
                - current_page
                - per_page
                - total_pages
                - total_count
                - ocorrencias
    post:
      summary: Cria uma nova ocorrência
      tags:
      - Ocorrências
      parameters: []
      responses:
        '201':
          description: Ocorrência criada com sucesso
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ocorrencia"
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                example:
                  errors:
                    id_tipo_crime:
                    - can't be blank
                    id_bairro:
                    - can't be blank
                    data_ocorrencia:
                    - can't be blank
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ocorrencia:
                  type: object
                  properties:
                    numero_bo:
                      type: string
                      example: BO-2024-001234
                    id_tipo_crime:
                      type: integer
                      example: 1
                    id_bairro:
                      type: integer
                      example: 5
                    data_ocorrencia:
                      type: string
                      format: date
                      example: '2024-01-15'
                    hora_ocorrencia:
                      type: string
                      format: time
                      example: '14:30:00'
                    dia_semana:
                      type: string
                      enum:
                      - Segunda
                      - Terça
                      - Quarta
                      - Quinta
                      - Sexta
                      - Sábado
                      - Domingo
                      example: Segunda
