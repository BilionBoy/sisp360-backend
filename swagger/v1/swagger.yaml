servers:
- url: http://localhost:3000
  description: Servidor de desenvolvimento local
- url: https://{production-host}
  description: Servidor de produção
  variables:
    production-host:
      default: api.sisp360.gov.br
components:
  schemas:
    Ocorrencia:
      type: object
      properties:
        id_ocorrencia:
          type: integer
          readOnly: true
        numero_bo:
          type: string
          nullable: true
        id_tipo_crime:
          type: integer
        id_bairro:
          type: integer
        data_ocorrencia:
          type: string
          format: date
        hora_ocorrencia:
          type: string
          format: time
          nullable: true
        dia_semana:
          type: string
          enum:
          - Segunda
          - Terça
          - Quarta
          - Quinta
          - Sexta
          - Sábado
          - Domingo
          nullable: true
        periodo_dia:
          type: string
          enum:
          - Madrugada
          - Manhã
          - Tarde
          - Noite
          nullable: true
        latitude_ocorrencia:
          type: number
          format: float
          nullable: true
        longitude_ocorrencia:
          type: number
          format: float
          nullable: true
        logradouro:
          type: string
          nullable: true
        numero_endereco:
          type: string
          nullable: true
        ponto_referencia:
          type: string
          nullable: true
        descricao_ocorrencia:
          type: string
          nullable: true
        vitimas:
          type: integer
          default: 1
        valor_prejuizo:
          type: number
          format: float
          nullable: true
        recuperado:
          type: boolean
          default: false
        status_ocorrencia:
          type: string
          enum:
          - Registrada
          - Em Investigação
          - Resolvida
          - Arquivada
          default: Registrada
        origem_registro:
          type: string
          enum:
          - PM
          - PC
          - Sistema Integrado
          - Outro
          default: PM
        data_registro:
          type: string
          format: date-time
          readOnly: true
        usuario_registro:
          type: string
          nullable: true
      required:
      - id_tipo_crime
      - id_bairro
      - data_ocorrencia
    Bairro:
